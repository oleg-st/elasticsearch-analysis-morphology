buildscript {
    if (VersionNumber.parse(version as String) < VersionNumber.parse('8.16.0')) {
        throw new GradleException("Minimum supported Elasticsearch version is 8.16.0; requested ${version}")
    }
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath "org.elasticsearch.gradle:build-tools:$version"
    }
}

apply plugin: 'java'
apply plugin: 'elasticsearch.esplugin'
apply plugin: 'elasticsearch.yaml-rest-test'

repositories {
    flatDir {
        dirs 'libs'
    }
    mavenCentral()
}

esplugin {
    description 'English and Russian Morphology for ElasticSearch.'
    classname 'org.elasticsearch.plugin.analysis.morphology.AnalysisMorphologyPlugin'
    name 'analysis-morphology'
    licenseFile = rootProject.file('LICENSE.txt')
    noticeFile = rootProject.file('NOTICE.txt')
}
// Keep the Elasticsearch target unchanged; identify this plugin's surname revision separately.
esplugin.version = "${version}-surnames.3"

tasks.named('bundlePlugin', Zip) {
    archiveVersion = esplugin.version
}

configurations {
    yamlRestTestRuntimeOnly.extendsFrom testRuntimeOnly
    restTestSpecs
}

test {
    /* A workaround is to disable the security manager during test
       Java 17+:
       "unable to install test security manager"
       "The Security Manager is deprecated and will be removed in a future release" */
    jvmArgs '-Dtests.security.manager=false'
}

yamlRestTest {
    /* A workaround is to disable the security manager during test
       Java 17+:
       "unable to install test security manager"
       "The Security Manager is deprecated and will be removed in a future release" */
    jvmArgs '-Dtests.security.manager=false'
}

// The minimal INTEG_TEST distribution omits analysis-common (multiplexer, pattern_capture, stop).
testClusters.named('yamlRestTest').configure {
    testDistribution = 'DEFAULT'
    setting 'xpack.security.enabled', 'false'
    // build-tools 8.x clears these for INTEG_TEST but does not restore them when switching to DEFAULT.
    org.elasticsearch.gradle.DistributionDownloadPlugin.getContainer(project).matching {
        it.name.startsWith('testclusters--yamlRestTest-')
    }.configureEach {
        platform = org.elasticsearch.gradle.ElasticsearchDistribution.CURRENT_PLATFORM
        bundledJdk = true
    }
}

// Elasticsearch 8.16+ uses morphology 1.8 (Lucene 9).
ext.morphVersion = '1.8'

dependencies {
    testRuntimeOnly 'org.apache.logging.log4j:log4j-core:2.17.2'
    yamlRestTestRuntimeOnly 'org.apache.logging.log4j:log4j-core:2.17.2'
    implementation "org.apache.lucene.morphology:russian:${project.morphVersion}"
    implementation "org.apache.lucene.morphology:english:${project.morphVersion}"
    implementation "org.apache.lucene.morphology:morph:${project.morphVersion}"
}
